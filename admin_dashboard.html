<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCU - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modern Light Blue Design */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f0f7ff; 
            margin: 0; 
            padding: 0;
            min-height: 100vh;
        }

        /* Top Header Area */
        .header {
            background-color: #003366;
            color: white;
            padding: 20px 5%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        #welcome-message {
            color: #003366;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
        }

        /* 5-Item Card Grid */
        .dashboard-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        /* Card Style */
        .dashboard-menu a {
            background: white;
            padding: 40px 20px;
            border-radius: 15px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.08);
            border-bottom: 6px solid #007bff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .dashboard-menu a:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0, 123, 255, 0.15);
            background-color: #ffffff;
        }

        /* Icons Color */
        .dashboard-menu i {
            font-size: 45px;
            color: #007bff;
        }

        /* Logout Specific Card */
        #logout_link {
            border-bottom-color: #dc3545;
        }
        #logout_link i {
            color: #dc3545;
        }

        @media (max-width: 600px) {
            .dashboard-menu { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>WCU - Admin Panel</h1>
    </div>

    <div class="container">
        <p id="welcome-message">Welcome, Administrator!</p>
        
        <div class="dashboard-menu">
            <a href="manage_accounts.html">
                <i class="fas fa-users"></i>
                Manage User Accounts
            </a>

            <a href="manage_categories.html">
                <i class="fas fa-list-alt"></i>
                Manage Categories
            </a>

            <a href="admin_feedback.html">
                <i class="fas fa-tasks"></i>
                Assign Feedback
            </a>

            <a href="admin_reports.html">
                <i class="fas fa-file-invoice"></i>
                Generate Reports
            </a>

            <a href="#" id="logout_link">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
        
        <p id="message" style="text-align: center; margin-top: 20px; color: #dc3545;"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Personalize the welcome message (Exactly as your original)
            const username = sessionStorage.getItem('full_name') || 'Administrator'; 
            document.getElementById('welcome-message').textContent = `Welcome, ${username} (Admin)!`;
        });
        
        // Logout functionality (Exactly as your original)
        document.getElementById('logout_link').addEventListener('click', function(e) {
            e.preventDefault();
            
            fetch('auth_handler.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'action=logout'
            })
            .then(response => response.json())
            .then(data => {
                sessionStorage.clear(); 
                alert(data.message || "Logged out successfully!");
                window.location.href = 'login.html';
            })
            .catch(error => {
                alert('Logout failed. Redirecting to login page.');
                window.location.href = 'login.html';
            });
        });
    </script>
</body>
</html>
