<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Generate Reports (UC-14)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        :root { 
            --primary-admin: #007bff; 
            --secondary-color: #28a745; /* Green for Reports */
            --bg-light: #f4f7f9; 
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }
        body { font-family: Arial, sans-serif; background-color: var(--bg-light); line-height: 1.6; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: var(--card-shadow); }
        h1 { color: var(--primary-admin); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 30px; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary-admin); text-decoration: none; font-weight: bold; }
        
        /* Report Options and Parameters */
        .report-parameters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            padding: 25px;
            border: 1px solid #cce5ff;
            border-radius: 5px;
            background-color: #e2f0ff; 
        }
        .param-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .param-group select, .param-group input[type="text"] { 
            padding: 10px; 
            border: 1px solid #007bff; 
            border-radius: 4px; 
            width: 100%; 
            background-color: #fff;
        }

        /* Action Buttons */
        .report-actions {
            text-align: center;
        }
        .report-actions button {
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 0 10px;
        }

        #generate-pdf {
            background-color: var(--secondary-color); /* Green */
            color: white;
        }
        #generate-pdf:hover { background-color: #1e7e34; }

        #generate-excel {
            background-color: #ffc107; /* Yellow/Orange */
            color: #333;
        }
        #generate-excel:hover { background-color: #e0a800; }
        
        /* Report Status/Logs */
        #report-log {
            margin-top: 40px;
            padding: 15px;
            border: 1px dashed #ccc;
            background-color: #f8f8f8;
            min-height: 50px;
            border-radius: 5px;
            text-align: left;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="admin_dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Admin Dashboard</a>
        <h1>Generate Feedback Reports (UC-14)</h1>

        <h2>Report Generation Parameters</h2>
        <div class="report-parameters">
            
            <div class="param-group">
                <label for="report-type">Report Type:</label>
                <select id="report-type">
                    <option value="summary">Summary of All Feedback</option>
                    <option value="faculty_performance">Faculty Performance Review</option>
                    <option value="department_analysis">Departmental Comparative Analysis</option>
                    <option value="category_breakdown">Category Breakdown (UC-13 Data)</option>
                </select>
            </div>
            
            <div class="param-group">
                <label for="dept-select">Department Scope:</label>
                <select id="dept-select">
                    <option value="all">All Departments</option>
                    <option value="cs">Computer Science</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="mgt">Management</option>
                </select>
            </div>
            
            <div class="param-group">
                <label for="time-period">Time Period:</label>
                <select id="time-period">
                    <option value="current_year">Current Academic Year</option>
                    <option value="last_semester">Last Semester</option>
                    <option value="custom">Custom Date Range</option>
                </select>
            </div>

            <div class="param-group">
                <label for="format-select">Output Format:</label>
                <select id="format-select">
                    <option value="pdf">PDF (Print/Presentation)</option>
                    <option value="excel">Excel/CSV (Data Analysis)</option>
                </select>
            </div>
            
        </div>

        <div class="report-actions">
            <button id="generate-pdf"><i class="fas fa-file-pdf"></i> Generate PDF Report</button>
            <button id="generate-excel"><i class="fas fa-file-excel"></i> Export Excel Data</button>
        </div>

        <h2>Report Status Log</h2>
        <div id="report-log">
            * Select parameters and click 'Generate' to start a new report process.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generatePdfBtn = document.getElementById('generate-pdf');
            const generateExcelBtn = document.getElementById('generate-excel');
            const reportLog = document.getElementById('report-log');

            function generateReport(format) {
                const reportType = document.getElementById('report-type').value;
                const dept = document.getElementById('dept-select').value;
                const timePeriod = document.getElementById('time-period').value;
                
                // 1. Update Log Status
                reportLog.innerHTML = `Initiating generation of **${reportType.toUpperCase()}** report for **${dept.toUpperCase()}**...`;
                
                // 2. Simulate Backend Call
                console.log(`Sending request to backend for ${format} report.`);

                // In a real system, you would perform a fetch request:
                // fetch('/api/reports/generate', {
                //     method: 'POST',
                //     headers: { 'Content-Type': 'application/json' },
                //     body: JSON.stringify({ type: reportType, dept: dept, period: timePeriod, format: format })
                // })
                // .then(response => {
                //     if (response.ok) {
                //         // Trigger file download
                //         reportLog.innerHTML += `<br>✅ Success: Report generated and downloading as .${format.toUpperCase()}.`;
                //         // window.location.href = response.url; 
                //     } else {
                //         reportLog.innerHTML += `<br>❌ Error: Failed to generate report. Check server logs.`;
                //     }
                // });
                
                // --- Simulated Success Response ---
                setTimeout(() => {
                     reportLog.innerHTML += `<br>... Data fetched and compiled successfully.`;
                }, 1000);

                setTimeout(() => {
                     reportLog.innerHTML += `<br>... Converting data to **${format.toUpperCase()}** format.`;
                }, 2000);

                setTimeout(() => {
                     reportLog.innerHTML += `<br>✅ **Success:** ${format.toUpperCase()} Report ready for download! (Simulated download start)`;
                }, 3500);
            }

            generatePdfBtn.addEventListener('click', () => generateReport('pdf'));
            generateExcelBtn.addEventListener('click', () => generateReport('excel'));
        });
    </script>

</body>
</html>
