<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        /* Modern Light Blue UI Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f7ff; /* Light Blue Background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 8px solid #007bff; /* Primary Blue Accent */
        }
        h2 {
            color: #0056b3;
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5ee;
            border-radius: 8px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .links {
            margin-top: 20px;
        }
        .links a {
            color: #007bff;
            text-decoration: none;
            font-size: 0.9em;
            font-weight: 500;
        }
        .links a:hover {
            text-decoration: underline;
        }
        /* Message Styles */
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 0.9em;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .loading { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Change Password</h2>
        <p class="subtitle">Update your account password to keep it secure.</p>
        
        <form id="changePasswordForm">
            <input type="hidden" name="action" value="change_password">
            
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" placeholder="Enter old password" required>
            </div>
            
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" placeholder="Min. 8 characters" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_new_password">Confirm New Password</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" placeholder="Repeat new password" required>
            </div>
            
            <button type="submit" class="btn-primary">Update Password</button>
            
            <div class="links">
                <a href="student_dashboard.html">← Back to Dashboard</a>
            </div>
            
            <div id="message" class="message"></div>
        </form>
    </div>

    <script>
        document.getElementById('changePasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_new_password').value;
            const messageElement = document.getElementById('message');

            // 1. Frontend Validation
            if (new_password !== confirm_password) {
                showMessage('Passwords do not match!', 'error');
                return;
            }

            if (new_password.length < 8) {
                showMessage('New password must be at least 8 characters long.', 'error');
                return;
            }
            
            // 2. Prepare Data
            const formData = new FormData(this);
            showMessage('Processing request...', 'loading');

            // 3. AJAX Fetch call to auth_handler.php
            fetch('auth_handler.php', { 
                method: 'POST', 
                body: formData 
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showMessage(data.message, 'success');
                    // Redirect to login after 2.5 seconds so they can log in with new password
                    setTimeout(() => window.location.href = 'login.html', 2500); 
                } else {
                    showMessage(data.message, 'error');
                }
            })
            .catch(error => {
                showMessage('Connection error. Please try again.', 'error');
                console.error('Error:', error);
            });
        });

        // Helper function to display messages
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
