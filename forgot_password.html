<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Step 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Reset Password (Step 1)</h2>
        <p>Enter your Student ID or registered Email to receive a verification code.</p>
        <form id="forgotPasswordForm">
            <input type="hidden" name="action" value="send_reset_otp">
            <div class="form-group">
                <label for="username">Student ID / Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <button type="submit" class="btn-primary">Send Verification Code</button>
            <p class="links"><a href="login.html">Back to Login</a></p>
            <p id="message" class="message"></p>
        </form>
    </div>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const messageElement = document.getElementById('message');
            messageElement.textContent = 'Sending OTP...';
            messageElement.className = 'message loading';

            fetch('auth_handler.php', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message success';
                    // Store email for Step 2
                    sessionStorage.setItem('reset_email', data.email); 
                    if (data.redirect) {
                        setTimeout(() => window.location.href = data.redirect, 2000);
                    }
                } else {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message error';
                }
            })
            .catch(error => {
                messageElement.textContent = 'Network error. Please try again.';
                messageElement.className = 'message error';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
