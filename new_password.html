<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Step 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Reset Password (Step 2)</h2>
        <p>Enter the code sent to your email/phone and your new password.</p>
        <form id="newPasswordForm">
            <input type="hidden" name="action" value="set_new_password">
            <input type="hidden" id="email" name="email"> 
            <div class="form-group">
                <label for="otp">Verification Code (OTP):</label>
                <input type="text" id="otp" name="otp" required>
            </div>
            <div class="form-group">
                <label for="new_password">New Password:</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="form-group">
                <label for="confirm_new_password">Confirm New Password:</label>
                <input type="password" id="confirm_new_password" name="confirm_new_password" required>
            </div>
            <button type="submit" class="btn-primary">Save New Password</button>
            <p id="message" class="message"></p>
        </form>
    </div>
    <script>
        const resetEmail = sessionStorage.getItem('reset_email');
        if (!resetEmail) {
            // Should not happen if Step 1 was completed
            window.location.href = 'forgot_password.html'; 
        } else {
            document.getElementById('email').value = resetEmail;
        }

        document.getElementById('newPasswordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const new_password = document.getElementById('new_password').value;
            const confirm_new_password = document.getElementById('confirm_new_password').value;
            const messageElement = document.getElementById('message');

            if (new_password !== confirm_new_password) {
                messageElement.textContent = 'New passwords do not match.';
                messageElement.className = 'message error';
                return;
            }

            if (new_password.length < 8) {
                messageElement.textContent = 'Password must be at least 8 characters long.';
                messageElement.className = 'message error';
                return;
            }
            
            const formData = new FormData(this);
            messageElement.textContent = 'Saving new password...';
            messageElement.className = 'message loading';

            fetch('auth_handler.php', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message success';
                    sessionStorage.removeItem('reset_email'); // Clean up
                    if (data.redirect) {
                        setTimeout(() => window.location.href = data.redirect, 2000);
                    }
                } else {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message error';
                }
            })
            .catch(error => {
                messageElement.textContent = 'Network error. Please try again.';
                messageElement.className = 'message error';
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
