<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wachemo University - Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1523050853063-913054672271?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo-container img {
            width: 70px;
            margin-bottom: 5px;
        }

        h2 { color: #003366; margin-bottom: 5px; font-size: 22px; font-weight: 700; }
        p.subtitle { color: #666; margin-bottom: 25px; font-size: 14px; }

        form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; }
        .full-width { grid-column: span 2; }

        .form-group { position: relative; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 13px; }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #003366;
            font-size: 14px;
        }

        input[type="text"], input[type="password"], input[type="email"], select {
            width: 100%;
            padding: 10px 10px 10px 35px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus { border-color: #003366; box-shadow: 0 0 8px rgba(0,51,102,0.1); }

        .btn-primary {
            grid-column: span 2;
            background: #003366;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-primary:hover { background: #00509e; transform: translateY(-2px); }

        .links { grid-column: span 2; margin-top: 15px; font-size: 13px; color: #666; text-align: center; }
        .links a { color: #003366; text-decoration: none; font-weight: 600; }

        .message { 
            grid-column: span 2;
            margin-top: 10px; 
            font-size: 13px; 
            padding: 10px; 
            border-radius: 5px; 
            display: none; 
            text-align: center;
        }
        .success { display: block; background: #d4edda; color: #155724; }
        .error { display: block; background: #f8d7da; color: #721c24; }

        /* Responsive */
        @media (max-width: 480px) {
            form { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .btn-primary, .links, .message { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="logo-container">
            <img style="width: 35%;"  src="logo3.png" alt="WCU Logo" onerror="this.src='https://via.placeholder.com/70?text=WCU'">
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Join Wachemo University Feedback System</p>

        <form id="registerForm">
            <input type="hidden" name="action" value="register">
            
            <div class="form-group">
                <label>Student ID</label>
                <div class="input-wrapper">
                    <i class="fas fa-id-card"></i>
                    <input type="text" name="student_id" placeholder="ID Number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="full_name" placeholder="Your Name" required>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Department</label>
                <div class="input-wrapper">
                    <i class="fas fa-university"></i>
                    <select name="department" required style="padding-left: 35px;">
                        <option value="">-- Select Department --</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Software Engineering">Software Engineering</option>
                         <option value="Information technology">Information technology</option>
                          <option value="Information system">Information system</option>
                          <option value="Mechanical Engineering">Mechanical Engineering</option>
                          <option value="Servey Engineering">Servey Engineering</option>
                          <option value="Chemical Engineering">Chemical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="example@wcu.edu.et" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirm_password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">REGISTER NOW</button>

            <div class="links">
                Already have an account? <a href="login.html">Login Here</a>
            </div>
            
            <p id="message" class="message"></p>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const messageElement = document.getElementById('message');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                messageElement.textContent = 'Passwords do not match.';
                messageElement.className = 'message error';
                return;
            }

            const formData = new FormData(this);
            messageElement.textContent = 'Creating account...';
            messageElement.className = 'message';
            messageElement.style.display = 'block';

            fetch('auth_handler.php', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message success';
                    sessionStorage.setItem('verify_email', document.getElementById('email').value);
                    if (data.redirect) setTimeout(() => window.location.href = data.redirect, 2000);
                } else {
                    messageElement.textContent = data.message;
                    messageElement.className = 'message error';
                }
            })
            .catch(error => {
                messageElement.textContent = 'Network error. Please try again.';
                messageElement.className = 'message error';
            });
        });
    </script>
</body>
</html>
